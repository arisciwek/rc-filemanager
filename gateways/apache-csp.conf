# [security] Content-Security-Policy.
#
# Versi 1 (2026-08-23): cukup ketat utk object/base/frame, tetap
# mengizinkan inline + CDN (jsdelivr/cdnjs dsb.) agar engine TFM dan
# Roundcube tidak rusak.
#
# TODO evaluasi: hilangkan 'unsafe-inline'/'unsafe-eval' dengan nonce,
# dan gantikan wildcard https: menjadi host eksplisit.

<IfModule mod_headers.c>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'"
</IfModule>
