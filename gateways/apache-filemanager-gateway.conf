# [rc-filemanager] Gateway eksekusi langsung dari folder plugin.
#
# File sumber (ter-track git):
#   /var/www/roundcube/plugins/filemanager/gateways/filemanager.php
#
# URL yang dilayani:
#   /filemanager       -> mode klien (anonim) / staff SSO (sesi RC)
#   /filemanager.php   -> alias legacy, target yang sama
#
# Aktifkan: a2enconf filemanager-gateway && systemctl reload apache2

Alias /filemanager /var/www/roundcube/plugins/filemanager/gateways/filemanager.php
Alias /filemanager.php /var/www/roundcube/plugins/filemanager/gateways/filemanager.php

<Directory /var/www/roundcube/plugins/filemanager/gateways>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
