# [security] HSTS — paksa browser mengingat koneksi HTTPS.
# Dipasang global (satu aplikasi per server ini).
# Catatan: TLS terminate di proxy depan; header tetap diteruskan
# ke browser lewat respons Apache.
#
# Naikkan max-age bertahap bila perlu: 21600 (6 jam) -> 31536000.

<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>
